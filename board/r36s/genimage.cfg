image boot.vfat {
        vfat {
		/* Image and the DTB are also inside image.itb; these copies are for boot_discrete */
                file Image {
                        image = "Image"
                }
                file rk3326-r36s.dtb {
                        image = "rk3326-r36s.dtb"
                }
		file uboot.env {
			image = "uboot-env.bin"
		}
		file image.itb {
			image = "image.itb"
		}
        }

        size = 510M
}

image sdcard.img {
	hdimage {
	}
	partition u-boot {
		in-partition-table = "no"
		offset = 32K
		image = "u-boot-rockchip.bin"
	}
	partition boot {
		offset = 10M
		partition-type = 0xb
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
