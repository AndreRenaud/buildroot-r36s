# RetroArch configuration for the R36S.
#
# RetroArch only reads this file directly when told to:
#
#   retroarch --config /etc/retroarch.cfg -L /usr/lib/libretro/<core>_libretro.so <rom>
#
# Without --config it looks for ~/.config/retroarch/retroarch.cfg and, when
# there is none, copies this file there with config_save_on_exit forced on:
# from then on changes made here would be ignored.
#
# It runs as the unprivileged user "player" (groups video, audio, input),
# with nothing else holding the display (it has to become the DRM master).
# /etc and the ROM card are read-only as far as it is concerned: everything
# it writes goes under /home/player.

config_save_on_exit = "false"
remap_save_on_exit = "false"

#
# Video: OpenGL ES on EGL + GBM, straight on KMS/DRM. In an OpenGL ES build
# of RetroArch "gl" is the GLES2-level driver (the build also enables its
# GLES3 paths); "glcore" (GLES3 + slang shaders) is not built. Panfrost on
# the Mali-G31 does both, and of the installed cores only mupen64plus-next renders with GL
# (GLES3).
#
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
video_shader_enable = "false"

#
# Audio: ALSA, and quiet: the unit sits next to people. audio_volume is a
# gain in dB applied by RetroArch on top of the mixer level that
# /etc/init.d/S04volume sets.
#
audio_driver = "alsa"
audio_enable = "true"
audio_sync = "true"
audio_volume = "-6.0"
audio_mixer_volume = "-6.0"

#
# Input: evdev through udev. The controls are one uinput device, "R36S
# Gamepad" (r36s-gamepad), mapped by the autoconfig profile in
# joypad_autoconfig_dir: the button numbers below are explained there.
#
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
input_max_users = "1"

# Select + Start quits, back to whatever started RetroArch: Select (button
# 8) enables the hotkeys while it is held, Start (button 9) is "quit".
# FN (button 10) opens the menu. That bind is input_menu_toggle_btn in the
# autoconfig profile, not here, and the profile must not set
# input_enable_hotkey_btn: RetroArch lets a profile's menu button through
# without the hotkey enabler only in that arrangement.
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_gamepad_combo = "0"
quit_press_twice = "false"

#
# Menu: RGUI, the only one built. The buttons are labelled the Nintendo
# way, so A (right) is OK and B (bottom) is back.
#
menu_driver = "rgui"
menu_swap_ok_cancel_buttons = "false"
menu_pause_libretro = "true"
menu_enable_widgets = "false"
rgui_show_start_screen = "false"
pause_nonactive = "false"

#
# On-screen messages: errors only, as far as RetroArch allows. The message
# text has to stay on for errors to show; every notification with a switch
# of its own is off. Messages without one (state saved/loaded, what a core
# chooses to say) still appear.
#
video_font_enable = "true"
fps_show = "false"
notification_show_autoconfig = "false"
notification_show_autoconfig_fails = "true"
notification_show_cheats_applied = "false"
notification_show_patch_applied = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_set_initial_disk = "false"
notification_show_disk_control = "false"
notification_show_save_state = "false"
notification_show_fast_forward = "false"
notification_show_screenshot = "false"
notification_show_refresh_rate = "false"
notification_show_when_menu_is_alive = "false"

#
# Directories. The cores and the BIOS files are read-only; saves, states
# and everything else RetroArch writes are in player's home, never next to
# the ROMs.
#
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/retroarch/info"
system_directory = "/home/player/system"
systemfiles_in_content_dir = "false"
rgui_browser_directory = "/roms"

savefile_directory = "/home/player/saves"
savestate_directory = "/home/player/states"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
screenshots_in_content_dir = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"

rgui_config_directory = "/home/player/.config/retroarch/config"
core_options_path = "/home/player/.config/retroarch/retroarch-core-options.cfg"
global_core_options = "true"
input_remapping_directory = "/home/player/.config/retroarch/remaps"
playlist_directory = "/home/player/.config/retroarch/playlists"
screenshot_directory = "/home/player/screenshots"
cache_directory = "/tmp"
log_dir = "/tmp"

history_list_enable = "false"
content_runtime_log = "false"
core_info_cache_enable = "false"
savestate_thumbnail_enable = "false"
