// R36S settings, run on every start after the saved config.cfg

// Native panel mode, OpenGL ES 3 renderer
set vid_renderer "gles3"
set vid_fullscreen "1"
set r_mode "-1"
set r_customwidth "640"
set r_customheight "480"
// Stream vertices through one big buffer: Panfrost is slow with lots of
// small glBufferData() calls (9 -> 40-55 fps on demo1)
set gl3_usebigvbo "1"
set cl_showfps "1"

// Nintendo-style button labels: A (right) confirms in menus.
// (No semicolons in comments: Quake splits commands on them first.)
set joy_labels "3"
set joy_confirm "1"

// The analog sticks aren't usable yet (separate input device), so play on
// the D-pad and buttons. Start opens the menu.
bind DP_UP "+forward"
bind DP_DOWN "+back"
bind DP_LEFT "+left"
bind DP_RIGHT "+right"
bind SHOULDR_LEFT "+moveleft"
bind SHOULDR_RIGHT "+moveright"
bind TRIG_LEFT "+lookup"
bind TRIG_RIGHT "+lookdown"
bind BTN_EAST "+attack"
bind BTN_SOUTH "+moveup"
bind BTN_NORTH "+movedown"
bind BTN_WEST "weapnext"
bind BTN_BACK "inven"
bind BTN_GUIDE "cmd help"
bind STICK_LEFT "centerview"
bind STICK_RIGHT "weapprev"
