// R36S settings, run on every start after the saved config.cfg

// Native panel mode, OpenGL ES 3 renderer
set vid_renderer "gles3"
set vid_fullscreen "1"
set r_mode "-1"
set r_customwidth "640"
set r_customheight "480"
// Stream vertices through one big buffer: Panfrost is slow with lots of
// small glBufferData() calls (9 -> 40-55 fps on demo1)
set gl3_usebigvbo "1"
set cl_showfps "1"

// Nintendo-style button labels: A (right) confirms in menus.
// (No semicolons in comments: Quake splits commands on them first.)
set joy_labels "3"
set joy_confirm "1"

// Twin-stick controls: the left stick moves and strafes, the right stick
// looks around like a mouse. Always run, so a full push is full speed.
set joy_layout "0"
set cl_run "1"
set freelook "1"
set lookspring "0"

// Buttons, by position (BTN_EAST is "A", BTN_SOUTH "B", BTN_NORTH "X",
// BTN_WEST "Y"). Start opens the menu.
bind TRIG_RIGHT "+attack"
bind TRIG_LEFT "+movedown"
bind SHOULDR_RIGHT "weapnext"
bind SHOULDR_LEFT "weapprev"
bind BTN_EAST "+moveup"
bind BTN_SOUTH "+movedown"
bind BTN_WEST "invuse"
bind BTN_NORTH "invnext"
bind DP_UP "+forward"
bind DP_DOWN "+back"
bind DP_LEFT "+moveleft"
bind DP_RIGHT "+moveright"
bind BTN_BACK "inven"
bind BTN_GUIDE "cmd help"
bind STICK_LEFT "centerview"
bind STICK_RIGHT "+attack"
