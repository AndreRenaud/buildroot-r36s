# RetroArch autoconfig profile for the R36S's built-in controls.
#
# They are one uinput device, "R36S Gamepad", made by r36s-gamepad from the
# gpio-keys buttons and the adc-joystick sticks (see
# package/r36s-gamepad/src/r36s-gamepad.c). RetroArch matches the profile
# on input_driver and the device name; the device has no vendor/product ID.
#
# Button numbers
# --------------
# The udev joypad driver (input/drivers_joypad/udev_joypad.c) has no fixed
# numbering. It numbers the EV_KEY codes the device reports, from 0, in
# this order: KEY_UP..KEY_DOWN (103..108), then BTN_MISC (0x100) upwards,
# then the rest of the keyboard range, 0..102 and 109..255. Each range is
# walked in ascending code order.
#
# The device's keys are the ones in the gpio-keys node of rk3326-r36s.dts,
# after r36s-gamepad's remapping (top face button BTN_NORTH -> BTN_Y, left
# face button BTN_WEST -> BTN_X, BTN_TRIGGER_HAPPY1..5 -> BTN_SELECT,
# BTN_START, BTN_THUMBL, BTN_THUMBR, BTN_MODE). It has none of 103..108,
# so numbering starts in the BTN_ range:
#
#    #  code   name            control (label on the unit)
#    0  0x130  BTN_SOUTH       bottom face button (B)
#    1  0x131  BTN_EAST        right face button (A)
#    2  0x133  BTN_X           left face button (Y)  [sent for BTN_WEST]
#    3  0x134  BTN_Y           top face button (X)   [sent for BTN_NORTH]
#    4  0x136  BTN_TL          L1
#    5  0x137  BTN_TR          R1
#    6  0x138  BTN_TL2         L2
#    7  0x139  BTN_TR2         R2
#    8  0x13a  BTN_SELECT      Select
#    9  0x13b  BTN_START       Start
#   10  0x13c  BTN_MODE        FN
#   11  0x13d  BTN_THUMBL      left stick click (L3)
#   12  0x13e  BTN_THUMBR      right stick click (R3)
#   13  0x220  BTN_DPAD_UP     D-pad up
#   14  0x221  BTN_DPAD_DOWN   D-pad down
#   15  0x222  BTN_DPAD_LEFT   D-pad left
#   16  0x223  BTN_DPAD_RIGHT  D-pad right
#   17  114    KEY_VOLUMEDOWN  volume down (side)
#   18  115    KEY_VOLUMEUP    volume up (side)
#
# (0x132 BTN_C and 0x135 BTN_Z are not on the device, so they take no
# number.) Adding a key to gpio-keys or changing r36s-gamepad's remapping
# renumbers everything after it.
#
# The D-pad is four buttons, so there are no hats (h0up etc.).
#
# Axis numbers
# ------------
# Axes are numbered the same way, over the EV_ABS codes below ABS_MISC,
# skipping the hat range. adc-joystick has ABS_X (0), ABS_Y (1), ABS_RX (3)
# and ABS_RY (4), which become axes 0, 1, 2 and 3. RetroArch rescales each
# to -0x7fff..0x7fff from the range the device reports, so the direction
# follows the kernel's (the abs-range in the device tree): +X is right, +Y
# is down.
#
# RetroPad layout
# ---------------
# The RetroPad is laid out like a SNES pad and the R36S's buttons are
# labelled the same way, so each RetroPad button goes to the button with
# its letter: A right, B bottom, X top, Y left.

input_driver = "udev"
input_device = "R36S Gamepad"
input_device_display_name = "R36S Gamepad"

input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "2"
input_x_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "11"
input_r3_btn = "12"
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# FN opens the menu. Leave input_enable_hotkey_btn out of this file: it is
# in /etc/retroarch.cfg (Select), and RetroArch only lets this bind work
# without the hotkey enabler held when the profile itself has none.
input_menu_toggle_btn = "10"

input_b_btn_label = "B"
input_a_btn_label = "A"
input_y_btn_label = "Y"
input_x_btn_label = "X"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_select_btn_label = "Select"
input_start_btn_label = "Start"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
input_up_btn_label = "D-pad Up"
input_down_btn_label = "D-pad Down"
input_left_btn_label = "D-pad Left"
input_right_btn_label = "D-pad Right"
input_l_x_plus_axis_label = "Left Stick Right"
input_l_x_minus_axis_label = "Left Stick Left"
input_l_y_plus_axis_label = "Left Stick Down"
input_l_y_minus_axis_label = "Left Stick Up"
input_r_x_plus_axis_label = "Right Stick Right"
input_r_x_minus_axis_label = "Right Stick Left"
input_r_y_plus_axis_label = "Right Stick Down"
input_r_y_minus_axis_label = "Right Stick Up"
input_menu_toggle_btn_label = "FN"
